                fill="none" stroke="#0a2233" stroke-width=".8" stroke-dasharray="1 6" opacity=".2"/>
              <path class="land-ridge" d="M94 432 C 148 410 196 402 246 404 C 286 406 318 418 344 430"
                fill="none" stroke="#0a2233" stroke-width=".8" stroke-dasharray="1 6" opacity=".14"/>
              <text x="272" y="396" class="land-label">山 东</text>
              <text x="132" y="482" class="land-small">沂 蒙</text>

              <!-- 航线 -->
              <path id="seaRoute" class="route" d="M533 226
                C 592 186 666 212 684 272
                C 696 318 644 356 586 372
                C 546 383 514 392 492 402
                C 474 412 458 434 448 446"
                fill="none" stroke="#b8452f" stroke-width="1.5" stroke-dasharray="7 9" stroke-opacity=".7"/>

              <!-- 罗盘 -->
              <g class="map-compass" transform="translate(86,88)" fill="none" stroke="#0a2233" stroke-width="1">
                <circle r="30" opacity=".4"/>
                <circle r="20" opacity=".22"/>
                <path d="M0 -30 V-42 M0 30 V42 M-30 0 H-42 M30 0 H42" opacity=".4"/>
                <path d="M0 -18 L6 6 L0 2 L-6 6 Z" fill="#b8452f" stroke="none"/>
                <g stroke="none" fill="#b8452f" opacity=".3">
                  <circle cx="21" cy="21" r="1.6"/><circle cx="-21" cy="21" r="1.6"/>
                </g>
                <text x="0" y="-48" text-anchor="middle" font-size="11" fill="#0a2233" stroke="none" letter-spacing="2">N</text>
              </g>

              <!-- 港口由 JS 渲染 -->
              <g id="portLayer"></g>
            </svg>
          </div>

          <div class="map-meta">
            <p class="map-hint"><i class="dot"></i><span data-i18n="map_hint"></span></p>
            <p class="map-disclaimer" data-i18n="map_disclaimer"></p>
          </div>
        </div>

        <aside class="port-panel" id="portPanel" aria-live="polite"></aside>
      </div>
    </div>
  </section>

  <!-- ============ 贰 · 词源 ============ -->
  <section class="section sec-dark" id="lexicon">
    <div class="wrap">
      <header class="sec-head reveal">
        <div class="sec-no">贰</div>
        <div class="sec-kicker" data-i18n="s2_kicker"></div>
        <h2 class="sec-title" data-i18n="s2_title"></h2>
        <p class="sec-lead" data-i18n="s2_lead"></p>
      </header>
      <p class="hint-line reveal"><span data-i18n="lex_hint"></span><i>↻</i></p>
      <div class="lex-grid" id="lexGrid"></div>
    </div>
  </section>

  <!-- ============ 叁 · 解字「鲜」 ============ -->
  <section class="section sec-dark sec-glyph" id="glyph">
    <div class="wrap">
      <header class="sec-head reveal">
        <div class="sec-no">叁</div>
        <div class="sec-kicker" data-i18n="s_glyph_kicker"></div>
        <h2 class="sec-title" data-i18n="s_glyph_title"></h2>
        <p class="sec-lead" data-i18n="s_glyph_lead"></p>
      </header>

      <div class="glyph-layout">
        <div class="glyph-art reveal" id="glyphArt"></div>
        <div class="glyph-copy reveal">
          <p class="glyph-body" data-i18n="s_glyph_body"></p>
          <p class="glyph-body" data-i18n="s_glyph_body2"></p>
          <ul class="glyph-words" id="glyphWords"></ul>
          <p class="glyph-note" data-i18n="s_glyph_note"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ 肆 · 宴席 ============ -->
  <section class="section sec-paper" id="banquet">
    <div class="wrap">
      <header class="sec-head reveal">
        <div class="sec-no">肆</div>
        <div class="sec-kicker" data-i18n="s3_kicker"></div>
        <h2 class="sec-title" data-i18n="s3_title"></h2>
        <p class="sec-lead" data-i18n="s3_lead"></p>
      </header>
      <p class="hint-line reveal"><span data-i18n="banquet_hint"></span><i>↗</i></p>
      <div class="dish-grid" id="dishGrid"></div>
      <div class="table-line" aria-hidden="true"><span></span></div>
    </div>
  </section>

  <!-- ============ 伍 · 四时 ============ -->
  <section class="section sec-paper sec-tide" id="tide">
    <div class="wrap">
      <header class="sec-head reveal">
        <div class="sec-no">伍</div>
        <div class="sec-kicker" data-i18n="s_tide_kicker"></div>
        <h2 class="sec-title" data-i18n="s_tide_title"></h2>
        <p class="sec-lead" data-i18n="s_tide_lead"></p>
      </header>

      <div class="tide-layout">
        <div class="tide-wheel reveal" id="tideWheel" role="img" aria-label="四时海味"></div>
        <div class="tide-panel reveal">
          <div class="tide-tabs" id="tideTabs"></div>
          <div class="tide-body" id="tideBody"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ 陆 · 工序 ============ -->
  <section class="section sec-dark sec-craft" id="craft">
    <div class="wrap">
      <header class="sec-head reveal">
        <div class="sec-no">陆</div>
        <div class="sec-kicker" data-i18n="s4_kicker"></div>
        <h2 class="sec-title" data-i18n="s4_title"></h2>
        <p class="sec-lead" data-i18n="s4_lead"></p>
      </header>

      <div class="craft-rail">
        <div class="rail-line" aria-hidden="true"><i></i></div>
        <div class="craft-grid" id="craftGrid"></div>
      </div>
      <p class="craft-note reveal"><i></i><span data-i18n="craft_note"></span></p>
    </div>
  </section>

  <!-- ============ 柒 · 词源侦探 ============ -->
  <section class="section sec-paper" id="quiz">
    <div class="wrap">
      <header class="sec-head reveal">
        <div class="sec-no">柒</div>
        <div class="sec-kicker" data-i18n="s5_kicker"></div>
        <h2 class="sec-title" data-i18n="s5_title"></h2>
        <p class="sec-lead" data-i18n="s5_lead"></p>
      </header>
      <div class="quiz-shell reveal">
        <div class="quiz-box" id="quizBox"></div>
      </div>
    </div>
  </section>

  <!-- ============ 捌 · 年表 ============ -->
  <section class="section sec-dark" id="timeline">
    <div class="wrap">
      <header class="sec-head reveal">
        <div class="sec-no">捌</div>
        <div class="sec-kicker" data-i18n="s6_kicker"></div>
        <h2 class="sec-title" data-i18n="s6_title"></h2>
        <p class="sec-lead" data-i18n="s6_lead"></p>
      </header>

      <div class="time-head reveal">
        <p class="time-hint"><span data-i18n="time_drag"></span></p>
        <div class="time-nav">
          <button type="button" id="timePrev" aria-label="上一页">←</button>
          <button type="button" id="timeNext" aria-label="下一页">→</button>
        </div>
      </div>

      <div class="time-track" id="timeTrack" tabindex="0"></div>
      <div class="time-dots" id="timeDots"></div>
    </div>
  </section>

</main>

<!-- ============ 尾页 ============ -->
<footer class="footer" id="about">
  <div class="wrap">
    <div class="footer-grid">
      <div class="reveal">
        <p class="footer-kicker">01 · CONCEPT</p>
        <h3 data-i18n="about_concept_title"></h3>
        <p data-i18n="about_concept"></p>
      </div>
      <div class="reveal">
        <p class="footer-kicker">02 · REFERENCES</p>
        <h3 data-i18n="about_ref_title"></h3>
        <ul class="refs" id="refList"></ul>
        <p class="tiny" data-i18n="about_ref_note"></p>
      </div>
      <div class="reveal">
        <p class="footer-kicker">03 · TEAM</p>
        <h3 data-i18n="about_team_title"></h3>
        <p data-i18n="about_team"></p>
        <p class="muted" data-i18n="about_team2"></p>
        <button class="btn btn-ghost btn-small" type="button" data-open-ai>
          <span data-i18n="about_ai_btn"></span>
        </button>
        <p class="tiny" data-i18n="about_ai_note"></p>
      </div>
    </div>

    <div class="footer-bar">
      <span class="footer-note" data-i18n="footer_note"></span>
      <button class="to-top" type="button" id="toTop" aria-label="回到顶部">↑</button>
    </div>
  </div>
</footer>
</div>

<!-- ============ AI 说明 ============ -->
<div class="modal" id="aiModal" aria-hidden="true">
  <div class="modal-backdrop" data-close-ai></div>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="aiTitle">
    <button class="modal-x" type="button" data-close-ai aria-label="关闭">×</button>
    <p class="modal-kicker">AI · CREATION NOTE</p>
    <h2 id="aiTitle" data-i18n="ai_title"></h2>
    <p class="modal-note" data-i18n="ai_note"></p>
    <div class="modal-body" id="aiBody"></div>
    <button class="btn btn-primary btn-block" type="button" data-close-ai>
      <span data-i18n="ai_close"></span>
    </button>
  </div>
</div>

<script src="js/i18n.js"></script>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/deck.js"></script>
<script src="js/art.js"></script>
</body>
